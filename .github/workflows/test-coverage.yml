name: Test Coverage Validation

on:
  push:
    branches:
      - '**'
    paths:
      - 'inventory-microservice/**'
      - 'order-microservice/**'
      - 'payment-microservice/**'
      - 'outbox-messaging/**'
      - 'kafka-lib/**'
      - 'shared-kernel/**'
      - 'shared-test/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/test-coverage.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'inventory-microservice/**'
      - 'order-microservice/**'
      - 'payment-microservice/**'
      - 'outbox-messaging/**'
      - 'kafka-lib/**'
      - 'shared-kernel/**'
      - 'shared-test/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/test-coverage.yml'

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate backend test coverage reports
        run: >-
          ./gradlew
          :inventory-microservice:jacocoTestReport
          :order-microservice:jacocoTestReport
          :payment-microservice:jacocoTestReport
          :shared-kernel:jacocoTestReport
          :kafka-lib:jacocoTestReport
          :outbox-messaging:jacocoTestReport
          --no-parallel

      - name: Upload backend JaCoCo reports
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-reports
          path: |
            inventory-microservice/build/reports/jacoco/test/
            order-microservice/build/reports/jacoco/test/
            payment-microservice/build/reports/jacoco/test/
            shared-kernel/build/reports/jacoco/test/
            kafka-lib/build/reports/jacoco/test/
            outbox-messaging/build/reports/jacoco/test/
          if-no-files-found: error
