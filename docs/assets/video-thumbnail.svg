<text x="64" y="92" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Microservice Online Store</text>
<text x="64" y="145" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="26">Event-driven e-commerce walkthrough</text>
<text x="640" y="625" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">WATCH VIDEO</text>
