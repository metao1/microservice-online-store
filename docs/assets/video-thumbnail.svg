<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Microservice Online Store video</title>
<desc id="desc">Video thumbnail with a play button</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<circle cx="640" cy="360" r="104" fill="#ffffff" fill-opacity=".96" filter="url(#shadow)"/>
